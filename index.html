* {

  margin: 0;
  padding: 0;
}

:root {
  --primary: #111;
  --accent: #f5a623;
  --green: #25d366;
  --bg: #f6f6f6;
  --card: #fff;
  --text: #171717;
  --muted: #777;
  --danger: #e53935;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 90px;
}

button,
input,
textarea {
  font-family: inherit;
}

/* HEADER */

header {
  background: #111;
  color: white;
  padding: 22px 16px 18px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 50;
}

header h1 {
  font-size: 27px;
  margin-bottom: 5px;
}

header p {
  color: #ddd;
  font-size: 14px;
}

/* BUSCADOR */

.search-box {
  max-width: 900px;
  margin: 15px auto 0;
}

.search-box input {
  width: 100%;
  border: none;
  padding: 13px 16px;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

/* CATEGORÍAS */

.categories {
  position: sticky;
  top: 94px;
  z-index: 40;
  background: rgba(246,246,246,.97);
  padding: 12px 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category-btn {
  width: auto;
  display: inline-block;
  padding: 10px 15px;
  margin-right: 7px;
  border-radius: 999px;
  border: 1px solid #ddd;
  background: white;
  color: #222;
  font-size: 14px;
}

.category-btn.active {
  background: #111;
  color: white;
  border-color: #111;
}

/* CONTENEDOR */

.container {
  width: min(1100px, 100%);
  margin: auto;
  padding: 16px;
}

.section-title {
  margin: 15px 0;
  font-size: 22px;
}

/* PRODUCTOS */

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.producto {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,.08);
  position: relative;
  transition: transform .18s ease;
}

.producto:hover {
  transform: translateY(-2px);
}

.producto img {
  width: 100%;
  height: 185px;
  object-fit: cover;
  display: block;
  background: #ddd;
}

.producto-info {
  padding: 15px;
}

.producto h3 {
  font-size: 18px;
  margin-bottom: 6px;
}

.descripcion {
  font-size: 14px;
  color: var(--muted);
  min-height: 38px;
  line-height: 1.4;
}

.precio {
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

.add-btn {
  background: #111;
  color: white;
  border: none;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.add-btn:active {
  transform: scale(.96);
}

/* TENDENCIAS */

.trending {
  background: linear-gradient(135deg, #111, #272727);
  color: white;
  border-radius: 18px;
  padding: 18px;
  margin: 18px 0;
}

.trending h2 {
  margin-bottom: 5px;
}

.trending p {
  color: #ccc;
  font-size: 14px;
}

.trending-list {
  margin-top: 15px;
  display: grid;
  gap: 8px;
}

.trend-item {
  background: rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
}

/* CARRITO FLOTANTE */

.cart-floating {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: min(94%, 500px);
  background: #111;
  color: white;
  border-radius: 16px;
  padding: 13px 15px;
  z-index: 100;
  box-shadow: 0 8px 30px rgba(0,0,0,.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cart-floating strong {
  font-size: 16px;
}

.cart-floating small {
  color: #ccc;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.58);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(650px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 20px;
  animation: slideUp .25s ease;
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.close-btn {
  width: auto;
  background: #eee;
  color: #111;
  padding: 8px 12px;
}

/* ITEMS CARRITO */

.cart-item {
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.cart-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.cart-name {
  font-weight: bold;
}

.cart-price {
  font-weight: bold;
}

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}

.quantity-controls button {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 8px;
  background: #111;
  color: white;
}

.quantity {
  min-width: 25px;
  text-align: center;
  font-weight: bold;
}

.remove-btn {
  margin-left: auto;
  background: #eee !important;
  color: #c62828 !important;
}

.total-box {
  padding: 18px 0;
  font-size: 23px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

/* FORMULARIO */

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 5px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;

textarea {

.payment {

  padding: 13px;
  border-radius: 10px;
  margin-bottom: 14px;

.confirm-btn {
  background: var(--green);

  border: none;
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;

/* ANIMACIÓN */

.flying-product {
  position: fixed;
  z-index: 999;
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 12px;
  pointer-events: none;
  transition:
    left .55s cubic-bezier(.2,.8,.2,1),
    top .55s cubic-bezier(.2,.8,.2,1),
    width .55s,
    height .55s,
    opacity .55s;
  box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.cart-bounce {
  animation: cartBounce .45s ease;
}

@keyframes cartBounce {
  0% { transform: translateX(-50%) scale(1); }
  40% { transform: translateX(-50%) scale(1.08); }
  70% { transform: translateX(-50%) scale(.96); }
  100% { transform: translateX(-50%) scale(1); }
}

/* VACÍO */

.empty {
  text-align: center;
  padding: 30px 10px;
  color: #777;

/* FOOTER */

footer {

  padding: 35px 20px;

/* DESKTOP */

  }

  @keyframes cartBounceDesktop {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); }
    70% { transform: scale(.96); }
    100% { transform: scale(1); }
  }
}

/* =========================
   CARRITO
========================= */

let carrito = [];


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(lista = productos) {

  const menu = document.getElementById("menu");

  menu.innerHTML = "";

  if (lista.length === 0) {

    menu.innerHTML = `
      <div class="empty">
        <h3>No encontramos productos</h3>
        <p>Prueba con otro nombre.</p>
      </div>
    `;

    return;
  }

  lista.forEach(producto => {

    menu.innerHTML += `

      <article class="producto">

        <img
          src="${producto.imagen}"
          alt="${producto.nombre}"
          loading="lazy"
        >

        <div class="producto-info">

          <h3>${producto.nombre}</h3>

          <p class="descripcion">
            ${producto.descripcion}
          </p>

          <div class="precio">
            RD$${producto.precio}
          </div>

          <button
            class="add-btn"
            onclick="agregarProducto('${producto.id}', this)"
          >
            Agregar al pedido
          </button>

        </div>

      </article>

    `;
  });
}


/* =========================
   AGREGAR
========================= */

function agregarProducto(id, boton) {

  const producto = productos.find(p => p.id === id);

  if (!producto) return;

  const existente = carrito.find(item => item.id === id);

  if (existente) {

    existente.cantidad++;

  } else {

    carrito.push({
      id: producto.id,
      nombre: producto.nombre,
      precio: producto.precio,
      imagen: producto.imagen,
      cantidad: 1
    });

  }

  animarAlCarrito(boton, producto.imagen);

  mostrarCarrito();
}


/* =========================
   ANIMACIÓN PRODUCTO
========================= */

function animarAlCarrito(boton, imagen) {

  const img = boton.closest(".producto").querySelector("img");

  if (!img) return;

  const origen = img.getBoundingClientRect();

  const carritoFlotante =
    document.getElementById("cartFloating");

  const destino =
    carritoFlotante.getBoundingClientRect();

  const clon = document.createElement("img");

  clon.src = imagen;

  clon.className = "flying-product";

  clon.style.left = origen.left + "px";
  clon.style.top = origen.top + "px";

  document.body.appendChild(clon);

  requestAnimationFrame(() => {

    clon.style.left =
      (destino.left + destino.width / 2 - 32) + "px";

    clon.style.top =
      (destino.top + destino.height / 2 - 32) + "px";

    clon.style.width = "20px";
    clon.style.height = "20px";
    clon.style.opacity = "0";

  });

  setTimeout(() => {

    clon.remove();

    carritoFlotante.classList.remove("cart-bounce");

    void carritoFlotante.offsetWidth;

    carritoFlotante.classList.add("cart-bounce");

  }, 600);
}


/* =========================
   CAMBIAR CANTIDAD
========================= */

function cambiarCantidad(id, cambio) {

  const item = carrito.find(p => p.id === id);

  if (!item) return;

  item.cantidad += cambio;

  if (item.cantidad <= 0) {

    carrito =
      carrito.filter(p => p.id !== id);

  }

  mostrarCarrito();
}


/* =========================
   CARRITO
========================= */

function calcularTotal() {

  return carrito.reduce(
    (total, item) =>
      total + item.precio * item.cantidad,
    0
  );
}


function calcularCantidadTotal() {

  return carrito.reduce(
    (total, item) =>
      total + item.cantidad,
    0
  );
}


function mostrarCarrito() {

  const lista =
    document.getElementById("listaCarrito");

  const total =
    calcularTotal();

  const cantidad =
    calcularCantidadTotal();

  document.getElementById("totalCarrito").textContent =
    "RD$" + total;

  document.getElementById("floatingTotal").textContent =
    "RD$" + total;

  document.getElementById("cartCount").textContent =
    cantidad === 1
      ? "1 artículo"
      : cantidad + " artículos";

  document.getElementById("formTotal").textContent =
    "RD$" + total;

  if (carrito.length === 0) {

    lista.innerHTML = `
      <div class="empty">
        <h3>🛒 Tu pedido está vacío</h3>
        <p>Agrega algo delicioso para comenzar.</p>
      </div>
    `;

    return;
  }

  lista.innerHTML = "";

  carrito.forEach(item => {

    const subtotal =
      item.precio * item.cantidad;

    lista.innerHTML += `

      <div class="cart-item">

        <div class="cart-row">

          <span class="cart-name">
            ${item.nombre}
          </span>

          <span class="cart-price">
            RD$${subtotal}
          </span>

        </div>

        <div class="quantity-controls">

          <button
            onclick="cambiarCantidad('${item.id}', -1)"
          >
            −
          </button>

          <span class="quantity">
            ${item.cantidad}
          </span>

          <button
            onclick="cambiarCantidad('${item.id}', 1)"
          >
            +
          </button>

          <button
            class="remove-btn"
            onclick="eliminarProducto('${item.id}')"
          >
            🗑️
          </button>

        </div>

      </div>

    `;
  });
}


function eliminarProducto(id) {

  carrito =
    carrito.filter(item => item.id !== id);

  mostrarCarrito();
}


/* =========================
   MODALES
========================= */

function abrirCarrito() {

  document
    .getElementById("cartModal")
    .classList.add("show");

  mostrarCarrito();
}


function cerrarCarrito() {

  document
    .getElementById("cartModal")
    .classList.remove("show");
}


function mostrarFormulario() {

  if (carrito.length === 0) {

    alert("Agrega algún producto primero.");

    return;
  }

  cerrarCarrito();

  document
    .getElementById("formModal")
    .classList.add("show");

  mostrarCarrito();
}


function cerrarFormulario() {

  document
    .getElementById("formModal")
    .classList.remove("show");
}


function cerrarSiFondo(event) {

  if (event.target === event.currentTarget) {

    event.currentTarget.classList.remove("show");

  }
}


/* =========================
   FILTROS
========================= */

function activarBoton(boton) {

  document
    .querySelectorAll(".category-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  if (boton) {
    boton.classList.add("active");
  }
}


function filtrarCategoria(categoria, boton) {

  activarBoton(boton);

  document
    .getElementById("tendencias")
    .style.display = "none";

  document.getElementById("tituloMenu").textContent =
    categoria === "Todos"
      ? "Nuestro menú"
      : categoria;

  if (categoria === "Todos") {

    mostrarProductos(productos);

  } else {

    mostrarProductos(
      productos.filter(
        p => p.categoria === categoria
      )
    );

  }

}


function buscarProductos() {

  const texto =
    document
      .getElementById("buscador")
      .value
      .toLowerCase()
      .trim();

  document
    .getElementById("tendencias")
    .style.display = "none";

  const encontrados =
    productos.filter(p =>
      p.nombre.toLowerCase().includes(texto) ||
      p.descripcion.toLowerCase().includes(texto) ||
      p.categoria.toLowerCase().includes(texto)
    );

  document.getElementById("tituloMenu").textContent =
    texto
      ? "Resultados"
      : "Nuestro menú";

  mostrarProductos(encontrados);
}


/* =========================
   TENDENCIAS
========================= */

function mostrarTendencias(boton) {

  activarBoton(boton);

  document
    .getElementById("tendencias")
    .style.display = "block";

  document.getElementById("tituloMenu").textContent =
    "Menú";

  const ventas =
    JSON.parse(
      localStorage.getItem("cafeteriaVentas") || "{}"
    );

  const ranking =
    Object.entries(ventas)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

  const lista =
    document.getElementById("listaTendencias");

  if (ranking.length === 0) {

    lista.innerHTML = `
      <div class="trend-item">
        <span>🔥 Aún no hay suficientes pedidos registrados.</span>
      </div>
    `;

  } else {

    lista.innerHTML = ranking.map(
      ([id, cantidad], index) => {

        const producto =
          productos.find(p => p.id === id);

        if (!producto) return "";

        const medalla =
          ["🥇", "🥈", "🥉"][index] || "🔥";

        return `
          <div class="trend-item">

            <span>
              ${medalla} ${producto.nombre}
            </span>

            <strong>
              ${cantidad} vendidos
            </strong>

          </div>
        `;

      }
    ).join("");

  }

  mostrarProductos(productos);
}


/* =========================
   REGISTRAR VENTA LOCAL
========================= */

function registrarVentaLocal() {

  const ventas =
    JSON.parse(
      localStorage.getItem("cafeteriaVentas") || "{}"
    );

  carrito.forEach(item => {

    ventas[item.id] =
      (ventas[item.id] || 0) +
      item.cantidad;

  });

  localStorage.setItem(
    "cafeteriaVentas",
    JSON.stringify(ventas)
  );
}


/* =========================
   NÚMERO DE PEDIDO
========================= */

function generarNumeroPedido() {

  let numero =
    parseInt(
      localStorage.getItem("numeroPedido") || "1000"
    );

  numero++;

  localStorage.setItem(
    "numeroPedido",
    numero
  );

  return numero;
}


/* =========================
   ENVIAR WHATSAPP
========================= */

function enviarPedido() {

  if (carrito.length === 0) {

    alert("Agrega algún producto primero.");

    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const direccion =
    document.getElementById("direccion").value.trim();

  const referencia =
    document.getElementById("referencia").value.trim();

  const notas =
    document.getElementById("notas").value.trim();

  if (!nombre || !telefono || !direccion) {

    alert(
      "Completa tu nombre, teléfono y dirección."
    );

    return;
  }

  const pedido =
    generarNumeroPedido();

  const total =
    calcularTotal();

  let mensaje =
    "🔔 *NUEVO PEDIDO #" +
    pedido +
    "*\n\n";

  mensaje +=
    "👤 *CLIENTE*\n" +
    nombre +
    "\n";

  mensaje +=
    "📱 *TELÉFONO*\n" +
    telefono +
    "\n\n";

  mensaje +=
    "📍 *DIRECCIÓN*\n" +
    direccion +
    "\n";

  if (referencia) {

    mensaje +=
      "🧭 *REFERENCIA*\n" +
      referencia +
      "\n";

  }

  mensaje += "\n🍔 *PEDIDO*\n";

  carrito.forEach(item => {

    const subtotal =
      item.precio * item.cantidad;

    mensaje +=
      "• " +
      item.cantidad +
      "× " +
      item.nombre +
      " — RD$" +
      subtotal +
      "\n";

  });

  if (notas) {

    mensaje +=
      "\n📝 *NOTAS*\n" +
      notas +
      "\n";

  }

  mensaje +=
    "\n💰 *TOTAL: RD$" +
    total +
    "*\n";

  mensaje +=
    "💵 *PAGO: CONTRA ENTREGA*\n";

  mensaje +=
    "\n🟡 *ESTADO: NUEVO*";

  /* Guardamos una copia local mientras
     conectamos la base de datos */

  registrarVentaLocal();

  const pedidos =
    JSON.parse(
      localStorage.getItem("cafeteriaPedidos") || "[]"
    );

  pedidos.push({

    numeroPedido: pedido,

    fecha: new Date().toISOString(),

    cliente: {
      nombre,
      telefono,
      direccion,
      referencia,
      notas
    },

    productos: carrito.map(item => ({
      id: item.id,
      nombre: item.nombre,
      precio: item.precio,
      cantidad: item.cantidad
    })),

    total,

    pago: "Contra entrega",

    estado: "Nuevo"

  });

  localStorage.setItem(
    "cafeteriaPedidos",
    JSON.stringify(pedidos)
  );

  const numero =
    "18098142865";

  const url =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(mensaje);

  window.open(url, "_blank");

  /* Limpiar carrito después del envío */

  carrito = [];

  mostrarCarrito();

  cerrarFormulario();

  alert(
    "Pedido #" +
    pedido +
    " preparado correctamente."
  );
}


/* =========================
   INICIAR
========================= */

mostrarProductos();

mostrarCarrito();

</script>
